<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 Minute Method</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    text-align: center;
    padding: 40px 20px;
  }
  h1 { color: #f4a300; }
  #timer {
    font-size: 64px;
    margin: 20px 0;
  }
  button {
    background: #f4a300;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
  }
  button:hover { background: #d98e00; }
  #promptBox {
    display: none;
    margin-top: 20px;
    background: #22223b;
    padding: 20px;
    border-radius: 10px;
  }
  textarea {
    width: 80%;
    height: 60px;
    margin-top: 10px;
    padding: 10px;
    border-radius: 6px;
    border: none;
  }
  #log {
    margin-top: 30px;
    text-align: left;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }
  .entry {
    background: #22223b;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }

  @media (max-width: 500px) {
    body {
      padding: 20px 15px;
    }
    #timer {
      font-size: 48px;
    }
    button {
      padding: 14px 20px;
      font-size: 15px;
      margin: 4px 3px;
    }
    textarea {
      width: 90%;
    }
  }
</style>
</head>
<body>

<h1>18 Minute Method</h1>
<div id="timer">18:00</div>
<button id="startBtn">Start</button>
<button id="pauseBtn">Pause</button>
<button id="resetBtn">Reset</button>
<br>
<a href="log.html" style="display:inline-block; margin-top:15px; color:#f4a300; text-decoration:none; border:1px solid #f4a300; padding:8px 16px; border-radius:6px;">View All Past Entries</a>

<div id="promptBox">
  <p>Time's up! What did you just work on?</p>
  <textarea id="logInput" placeholder="What did you do in those 18 minutes?"></textarea><br>
  <button id="saveBtn">Save</button>
</div>

<div id="log"></div>

<script>
  const TOTAL_DURATION = 18 * 60;
  let timerInterval = null;
  let endTime = null;
  let pausedSecondsRemaining = TOTAL_DURATION;

  const timerDisplay = document.getElementById('timer');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const promptBox = document.getElementById('promptBox');
  const logInput = document.getElementById('logInput');
  const saveBtn = document.getElementById('saveBtn');
  const logDiv = document.getElementById('log');

  function updateDisplay(secondsToShow) {
    const minutes = Math.floor(secondsToShow / 60);
    const seconds = secondsToShow % 60;
    timerDisplay.textContent =
      String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  function tick() {
    const secondsLeft = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    updateDisplay(secondsLeft);

    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      promptBox.style.display = 'block';
    }
  }

  startBtn.addEventListener('click', function() {
    if (!timerInterval) {
      endTime = Date.now() + (pausedSecondsRemaining * 1000);
      timerInterval = setInterval(tick, 250);
      tick();
    }
  });

  pauseBtn.addEventListener('click', function() {
    if (timerInterval) {
      pausedSecondsRemaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
      clearInterval(timerInterval);
      timerInterval = null;
    }
  });

  resetBtn.addEventListener('click', function() {
    clearInterval(timerInterval);
    timerInterval = null;
    pausedSecondsRemaining = TOTAL_DURATION;
    updateDisplay(TOTAL_DURATION);
    promptBox.style.display = 'none';
  });

  saveBtn.addEventListener('click', function() {
    const entryText = logInput.value;
    if (entryText.trim() === '') return;

    const entry = document.createElement('div');
    entry.className = 'entry';

    const now = new Date().toLocaleString();
    entry.textContent = now + ' — ' + entryText;

    logDiv.prepend(entry);
    saveLogToStorage(now, entryText);

    logInput.value = '';
    promptBox.style.display = 'none';
    pausedSecondsRemaining = TOTAL_DURATION;
    updateDisplay(TOTAL_DURATION);
  });

  function saveLogToStorage(time, text) {
    const existing = JSON.parse(localStorage.getItem('eighteenMinLog') || '[]');
    existing.unshift({ time: time, text: text });
    localStorage.setItem('eighteenMinLog', JSON.stringify(existing));
  }

  function loadLogFromStorage() {
    const existing = JSON.parse(localStorage.getItem('eighteenMinLog') || '[]');
    existing.forEach(function(item) {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.textContent = item.time + ' — ' + item.text;
      logDiv.appendChild(entry);
    });
  }

  updateDisplay(TOTAL_DURATION);
  loadLogFromStorage();

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && timerInterval) {
      tick();
    }
  });
</script>

</body>
</html>
