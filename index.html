<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 Minute Method</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="18 Min Method">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    text-align: center;
    padding: 40px 20px;
  }
  h1 { color: #f4a300; }
  #timer {
    font-size: 64px;
    margin: 20px 0;
  }
  button {
    background: #f4a300;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
  }
  button:hover { background: #d98e00; }
  #promptBox {
    display: none;
    margin-top: 20px;
    background: #22223b;
    padding: 20px;
    border-radius: 10px;
  }
  textarea {
    width: 80%;
    height: 60px;
    margin-top: 10px;
    padding: 10px;
    border-radius: 6px;
    border: none;
  }
  #log {
    margin-top: 30px;
    text-align: left;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }
  .entry {
    background: #22223b;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }

  #starRating {
    font-size: 32px;
    margin: 10px 0;
  }
  .star {
    cursor: pointer;
    color: #555;
    padding: 0 3px;
    transition: color 0.15s;
  }
  .star.selected {
    color: #f4a300;
  }

  #moodPicker {
    font-size: 28px;
    margin: 10px 0;
  }
  .mood {
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    opacity: 0.5;
    transition: opacity 0.15s, background 0.15s;
  }
  .mood.selected {
    opacity: 1;
    background: #33334d;
  }

  @media (max-width: 500px) {
    body {
      padding: 20px 15px;
    }
    #timer {
      font-size: 48px;
    }
    button {
      padding: 14px 20px;
      font-size: 15px;
      margin: 4px 3px;
    }
    textarea {
      width: 90%;
    }
  }
</style>
</head>
<body>

<h1>18 Minute Method</h1>
<div id="timer">18:00</div>
<button id="startBtn">Start</button>
<button id="pauseBtn">Pause</button>
<button id="resetBtn">Reset</button>
<br>
<a href="log.html" style="display:inline-block; margin-top:15px; color:#f4a300; text-decoration:none; border:1px solid #f4a300; padding:8px 16px; border-radius:6px;">View All Past Entries</a>

<div id="promptBox">
  <p>Time's up! What did you just work on?</p>
  <textarea id="logInput" placeholder="What did you do in those 18 minutes?"></textarea><br>

  <p>Did you enjoy the time spent?</p>
  <div id="starRating">
    <span class="star" data-value="1">☆</span>
    <span class="star" data-value="2">☆</span>
    <span class="star" data-value="3">☆</span>
    <span class="star" data-value="4">☆</span>
    <span class="star" data-value="5">☆</span>
  </div>

  <p>How was your mood?</p>
  <div id="moodPicker">
    <span class="mood" data-mood="green">🟢🙂</span>
    <span class="mood" data-mood="yellow">🟡😐</span>
    <span class="mood" data-mood="red">🔴☹️</span>
  </div>

  <button id="saveBtn">Save</button>
</div>

<div id="log"></div>

<script>
  const TOTAL_DURATION = 18 * 60;
  let timerInterval = null;
  let endTime = null;
  let pausedSecondsRemaining = TOTAL_DURATION;

  const timerDisplay = document.getElementById('timer');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const promptBox = document.getElementById('promptBox');
  const logInput = document.getElementById('logInput');
  const saveBtn = document.getElementById('saveBtn');
  const logDiv = document.getElementById('log');

  const starEls = document.querySelectorAll('.star');
  const moodEls = document.querySelectorAll('.mood');
  let selectedRating = 0;
  let selectedMood = null;

  starEls.forEach(function(star) {
    star.addEventListener('click', function() {
      selectedRating = Number(star.getAttribute('data-value'));
      starEls.forEach(function(s) {
        const sValue = Number(s.getAttribute('data-value'));
        if (sValue <= selectedRating) {
          s.textContent = '★';
          s.classList.add('selected');
        } else {
          s.textContent = '☆';
          s.classList.remove('selected');
        }
      });
    });
  });

  moodEls.forEach(function(mood) {
    mood.addEventListener('click', function() {
      selectedMood = mood.getAttribute('data-mood');
      moodEls.forEach(function(m) { m.classList.remove('selected'); });
      mood.classList.add('selected');
    });
  });

  function updateDisplay(secondsToShow) {
    const minutes = Math.floor(secondsToShow / 60);
    const seconds = secondsToShow % 60;
    timerDisplay.textContent =
      String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  function tick() {
    const secondsLeft = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    updateDisplay(secondsLeft);

    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      promptBox.style.display = 'block';
    }
  }

  startBtn.addEventListener('click', function() {
    if (!timerInterval) {
      endTime = Date.now() + (pausedSecondsRemaining * 1000);
      localStorage.setItem('eighteenMinEndTime', String(endTime));
      timerInterval = setInterval(tick, 250);
      tick();
    }
  });

  pauseBtn.addEventListener('click', function() {
    if (timerInterval) {
      pausedSecondsRemaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
      clearInterval(timerInterval);
      timerInterval = null;
      localStorage.removeItem('eighteenMinEndTime');
    }
  });

  resetBtn.addEventListener('click', function() {
    clearInterval(timerInterval);
    timerInterval = null;
    pausedSecondsRemaining = TOTAL_DURATION;
    updateDisplay(TOTAL_DURATION);
    promptBox.style.display = 'none';
    localStorage.removeItem('eighteenMinEndTime');
  });

  saveBtn.addEventListener('click', function() {
    const entryText = logInput.value;
    if (entryText.trim() === '') return;

    const entry = document.createElement('div');
    entry.className = 'entry';

    const now = new Date().toLocaleString();

    const ratingText = selectedRating > 0 ? '★'.repeat(selectedRating) + '☆'.repeat(5 - selectedRating) : 'No rating';
    const moodEmoji = { green: '🟢', yellow: '🟡', red: '🔴' }[selectedMood] || '';

    entry.textContent = now + ' — ' + entryText + '  |  ' + ratingText + '  ' + moodEmoji;

    logDiv.prepend(entry);

    saveLogToStorage(now, entryText, selectedRating, selectedMood);

    logInput.value = '';
    promptBox.style.display = 'none';
    pausedSecondsRemaining = TOTAL_DURATION;
    updateDisplay(TOTAL_DURATION);
    localStorage.removeItem('eighteenMinEndTime');

    selectedRating = 0;
    selectedMood = null;
    starEls.forEach(function(s) {
      s.textContent = '☆';
      s.classList.remove('selected');
    });
    moodEls.forEach(function(m) { m.classList.remove('selected'); });
  });

  function saveLogToStorage(time, text, rating, mood) {
    const existing = JSON.parse(localStorage.getItem('eighteenMinLog') || '[]');
    existing.unshift({ time: time, text: text, rating: rating, mood: mood });
    localStorage.setItem('eighteenMinLog', JSON.stringify(existing));
  }

  function loadLogFromStorage() {
    const existing = JSON.parse(localStorage.getItem('eighteenMinLog') || '[]');
    existing.forEach(function(item) {
      const entry = document.createElement('div');
      entry.className = 'entry';
      const ratingText = item.rating > 0 ? '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating) : '';
      const moodEmoji = { green: '🟢', yellow: '🟡', red: '🔴' }[item.mood] || '';
      entry.textContent = item.time + ' — ' + item.text + (ratingText ? '  |  ' + ratingText : '') + '  ' + moodEmoji;
      logDiv.appendChild(entry);
    });
  }

  updateDisplay(TOTAL_DURATION);
  loadLogFromStorage();

  const savedEndTime = localStorage.getItem('eighteenMinEndTime');
  if (savedEndTime) {
    const savedEndTimeNum = Number(savedEndTime);
    const secondsLeft = Math.round((savedEndTimeNum - Date.now()) / 1000);
    if (secondsLeft > 0) {
      endTime = savedEndTimeNum;
      timerInterval = setInterval(tick, 250);
      tick();
    } else {
      updateDisplay(0);
      promptBox.style.display = 'block';
      localStorage.removeItem('eighteenMinEndTime');
    }
  }

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && timerInterval) {
      tick();
    }
  });
</script>

</body>
</html>
